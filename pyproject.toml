[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senza"
version = "1.3.0"
description = "Zero-permission Virtual DualSense bridge, MacBook Trackpad + Keyboard GTA 6 Smart Pack, and WAN stream optimizer for PS5 Remote Play on Apple Silicon macOS."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Yaman Devrim" }]
keywords = ["macos", "apple-silicon", "ps5", "remote-play", "dualsense", "chiaki", "gta6", "raycast"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/yyamandevrim/senza"
Repository = "https://github.com/yyamandevrim/senza"
Issues = "https://github.com/yyamandevrim/senza/issues"

[project.scripts]
senza = "senza.cli:main"

[tool.setuptools.packages.find]
include = ["senza*"]

[tool.setuptools.package-data]
senza = ["resources/*"]
