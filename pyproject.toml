[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senza"
dynamic = ["version"]
description = "Zero-permission Virtual DualSense bridge, MacBook Trackpad + Keyboard GTA 6 Smart Pack, and WAN stream optimizer for PS5 Remote Play on Apple Silicon macOS."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Yaman Devrim" }]
keywords = ["macos", "apple-silicon", "ps5", "remote-play", "dualsense", "chiaki", "gta6", "raycast"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/yyamandevrim/senza"
Repository = "https://github.com/yyamandevrim/senza"
Issues = "https://github.com/yyamandevrim/senza/issues"

[project.scripts]
senza = "senza.cli:main"

[tool.setuptools.dynamic]
version = { attr = "senza.__version__" }

[tool.setuptools.packages.find]
include = ["senza*"]

[tool.setuptools.package-data]
senza = ["resources/*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM"]
ignore = [
    "E501",   # line length is owned by `ruff format`
    "UP038",  # isinstance(x, A | B) is slower; rule is deprecated in newer ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
